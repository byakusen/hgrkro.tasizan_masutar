<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たし算マスター</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ベース設定：目に優しい淡いパステル調 */
        body { 
            font-family: 'M PLUS Rounded 1c', sans-serif; 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e6 100%);
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column;
            color: #555;
        }
        /* グラスモーフィズム効果 */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15); }
        .hidden { display: none !important; }
        .btn-active:active { transform: scale(0.96); filter: brightness(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* アニメーション */
        @keyframes rockShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
        .animate-shake { animation: rockShake 0.1s linear infinite; }
        
        .rock-fragment { position: absolute; background: #fbbf24; border: 2px solid #b45309; z-index: 50; pointer-events: none; border-radius: 4px; }
        @keyframes fragmentFly { 0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(0.5); opacity: 0; } }
        
        .firework-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 100; box-shadow: 0 0 6px currentColor; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        
        .path-hanamaru { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawHanamaru 2s ease-out forwards; }
        @keyframes drawHanamaru { to { stroke-dashoffset: 0; } }

        /* テンキー配置 */
        .numpad-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 4px; max-width: 400px; margin: 0 auto; width: 100%; }
        /* OKボタン */
        .ok-btn-cell { background: linear-gradient(135deg, #fb7185, #f43f5e); color: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.5rem; border-radius: 16px; box-shadow: 0 4px 0 #be123c; border: none; }
        .ok-btn-cell:active { box-shadow: 0 0 0 #be123c; transform: translateY(4px); }

        .num-btn { background: rgba(255,255,255,0.9); color: #be185d; border-radius: 16px; font-weight: 800; font-size: 1.5rem; box-shadow: 0 4px 0 rgba(236, 72, 153, 0.1); border: 1px solid rgba(255,255,255,0.8); }
        .num-btn:active { box-shadow: none; transform: translateY(4px); }

        /* 画面揺れ */
        .shake-screen { animation: rockShake 0.3s ease-in-out; }

        /* 認定証スタイル */
        .cert-container { 
            position: relative; 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-radius: 8px; 
            overflow: hidden; 
            user-select: auto; 
        }
        .cert-bg { width: 100%; height: auto; display: block; }
        
        .cert-input {
            position: absolute;
            background: transparent;
            border: 1px dashed rgba(0,0,0,0.0);
            font-family: sans-serif;
            font-weight: bold;
            color: #111;
            padding: 0 2px;
            line-height: 1.1;
            z-index: 10;
        }
        .cert-input:focus { 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid #f43f5e; 
            outline: none; 
            border-radius: 4px;
        }

        /* 写真エリア */
        .cert-photo-area {
            position: absolute;
            background: #fff1f2;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            border: 2px dashed #fbcfe8;
            z-index: 5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cert-photo-area:hover { border-color: #f43f5e; background: #ffe4e6; }
        .cert-photo-img { width: 100%; height: 100%; object-fit: cover; }
        .cert-photo-placeholder { text-align: center; color: #db2777; pointer-events: none; }
        
        /* ボタン無効状態 */
        .btn-disabled { opacity: 0.5; pointer-events: none; background: #eee !important; color: #aaa !important; border-color: #ddd !important; box-shadow: none !important; }
        
        /* モードボタンアクティブ/非アクティブ */
        .mode-btn-active { background: #fb923c !important; color: white !important; border-bottom: 2px solid #ea580c !important; }
        .mode-btn-inactive { color: #f97316 !important; background: transparent; border-bottom: 2px solid transparent !important; }
        .mode-btn-inactive:hover { background: rgba(255,255,255,0.5); }

        /* ブロックヒント */
        .block-circle { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2); transition: all 0.3s; }
        .block-empty { border: 2px dashed #e2e8f0; background: transparent; box-shadow: none; }
        .block-red { background-color: #f43f5e; border: 1px solid #be123c; }
        .block-blue { background-color: #3b82f6; border: 1px solid #1d4ed8; }
        .block-spacer { width: 10px; }
    </style>
</head>
<body class="p-2 flex justify-center items-center">

    <div id="app-root" class="max-w-md mx-auto w-full h-[100dvh] flex flex-col relative transition-transform pb-2">
        
        <div class="flex bg-white/40 backdrop-blur-md rounded-full p-1 mb-2 shadow-sm flex-none h-12 items-center">
            <button id="nav-challenge" onclick="switchTab('challenge')" class="flex-1 h-full rounded-full text-sm font-bold transition-all bg-pink-400 text-white shadow-md flex items-center justify-center gap-1">

            <button id="nav-record" onclick="switchTab('record')" class="flex-1 h-full rounded-full text-sm font-bold transition-all text-pink-600 flex items-center justify-center gap-1">

        </div>

        <div id="scr-menu" class="screen glass rounded-3xl p-3 text-center flex-1 flex flex-col justify-start overflow-hidden relative">
            
            <div class="space-y-2 relative flex flex-col h-full">
                <h1 class="text-lg font-black text-pink-500 flex justify-center items-center gap-2 mt-1 drop-shadow-sm flex-none">
                    <i data-lucide="plus-circle" class="w-5 h-5 fill-pink-100"></i> たし算にちょうせん！

                    <input type="text" id="user-name-input" placeholder="おなまえ (例: 1-1 はなこ)"

                    <i data-lucide="play" class="w-5 h-5 fill-current"></i> スタート！

                <div id="nigate-area" class="hidden flex-none w-full animate-pulse">

                </div>

                <div class="space-y-1 border-t border-pink-100 pt-2 flex-none">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-sp-15" onclick="startGame('range', '15')" class="py-2 rounded-lg font-bold text-base shadow-sm border border-gray-200 bg-gray-50 text-gray-400 cursor-not-allowed relative h-12 flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> 1〜5 まとめ</span>
                        </button>
                        <button id="btn-sp-69" onclick="startGame('range', '69')" class="py-2 rounded-lg font-bold text-base shadow-sm border border-gray-200 bg-gray-50 text-gray-400 cursor-not-allowed relative h-12 flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> 6〜9 まとめ</span>
                        </button>
                    </div>
                    <div class="relative h-14" id="last-challenge-box">
                        <div id="rock-layer" class="absolute inset-0 z-20 flex items-center justify-center bg-gradient-to-br from-stone-400 to-stone-500 border-b-4 border-stone-600 rounded-lg shadow-lg cursor-pointer transition-transform" onclick="tryCrumble()">
                            <div class="text-stone-100 font-black text-[10px] tracking-widest flex flex-col items-center">
                                <span class="flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> MASTER SEAL</span>
                            </div>
                        </div>
                        <button id="btn-sp-last" onclick="startGame('last')" class="w-full h-full rounded-lg font-black text-base shadow-md border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed relative flex items-center justify-center" disabled>
                            <span class="flex items-center gap-1"><i data-lucide="lock" class="w-4 h-4"></i> ぜんぶにちょうせん！</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-game" class="screen hidden flex-1 flex flex-col min-h-0 space-y-2 fade-in">
            <div class="w-full bg-white/50 rounded-full h-3 overflow-hidden shadow-inner p-0.5">
                <div id="time-bar" class="bg-gradient-to-r from-pink-300 to-rose-400 h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
            </div>
            
            <div class="glass rounded-2xl px-4 py-2 flex justify-between items-center flex-none text-rose-500 shadow-sm h-14">
                <div class="flex items-center gap-2">
                    <div class="bg-rose-100 p-1.5 rounded-full"><i data-lucide="timer" class="w-5 h-5"></i></div>
                    <span id="display-timer" class="text-3xl font-mono font-black tracking-tighter">30</span>

            </div>
            
            <div class="glass rounded-3xl flex-1 flex flex-col justify-center items-center text-center shadow-lg relative min-h-0 px-2 py-4 mb-2">
                <div class="absolute top-3 left-0 w-full text-center">
                    <span class="bg-white/80 px-3 py-1 rounded-full text-[10px] text-pink-400 font-bold uppercase tracking-widest border border-pink-100">Question</span>
                </div>
                
                <div class="flex items-center justify-center gap-2 w-full mt-4">
                    <span id="q-text" class="text-5xl sm:text-6xl font-black text-slate-600 shrink-0 drop-shadow-sm" style="font-family: 'M PLUS Rounded 1c'">5 + 7</span>
                    <span class="text-3xl sm:text-4xl text-pink-200 shrink-0 font-black">＝</span>
                    <div id="a-field" class="min-w-[80px] h-20 border-b-4 border-rose-300 text-rose-500 flex items-center justify-center bg-white/80 rounded-xl text-5xl font-black pb-1 shadow-inner animate-pulse">?</div>

                    </button>
                    <div id="hint-area" class="hidden bg-white/50 p-2 rounded-xl border border-pink-100 w-full max-w-[280px] mt-1 transition-all">
                        <div id="blocks-container" class="space-y-1 flex flex-col items-center"></div>
                    </div>
                </div>
            </div>

            <div class="numpad-container flex-none">
                <button class="num-btn h-14" onclick="inputNum(1)">1</button>
                <button class="num-btn h-14" onclick="inputNum(2)">2</button>
                <button class="num-btn h-14" onclick="inputNum(3)">3</button>
                
                <button class="num-btn h-14" onclick="inputNum(4)">4</button>
                <button class="num-btn h-14" onclick="inputNum(5)">5</button>
                <button class="num-btn h-14" onclick="inputNum(6)">6</button>
                
                <button class="num-btn h-14" onclick="inputNum(7)">7</button>
                <button class="num-btn h-14" onclick="inputNum(8)">8</button>
                <button class="num-btn h-14" onclick="inputNum(9)">9</button>
                
                <button class="glass h-14 rounded-2xl flex items-center justify-center bg-rose-50 text-rose-400 active:bg-rose-100 active:scale-95 transition-transform" onclick="deleteNum()">
                    <i data-lucide="delete" class="w-6 h-6"></i>
                </button>
                <button class="num-btn h-14" onclick="inputNum(0)">0</button>
                <button class="ok-btn-cell h-14" onclick="submitAnswer()">OK</button>
            </div>
        </div>

        <div id="screen-result" class="screen hidden glass rounded-3xl p-6 text-center flex-1 flex flex-col justify-center items-center relative overflow-hidden fade-in">
            <div id="fireworks-container" class="absolute inset-0 pointer-events-none z-0"></div>
            <div id="hanamaru-area" class="flex justify-center items-center w-full h-48 mb-4 z-10 relative drop-shadow-xl"></div>
            <div class="z-10 relative w-full bg-white/60 p-6 rounded-3xl backdrop-blur-sm border border-white">
                <h2 id="result-msg" class="text-4xl font-black text-rose-500 mb-2 tracking-wider"></h2>
                <p id="result-sub" class="text-sm font-bold text-gray-500 mb-6"></p>
                <button onclick="backToTitle()" class="w-full py-4 rounded-2xl font-black text-lg shadow-xl bg-gradient-to-r from-pink-400 to-rose-400 text-white btn-active flex items-center justify-center gap-2 border-b-4 border-rose-500 active:border-b-0 active:translate-y-1">
                    <i data-lucide="home" class="w-5 h-5"></i> タイトルへもどる
                </button>
            </div>
        </div>

        <div id="screen-record" class="screen hidden flex-1 flex flex-col min-h-0 space-y-2 fade-in overflow-hidden">
            <div id="master-badge" class="hidden flex-none text-center py-4 bg-gradient-to-br from-yellow-50 to-white rounded-2xl border-2 border-yellow-200 shadow-sm relative overflow-hidden shrink-0">
                <div class="absolute top-0 left-0 w-full h-2 bg-yellow-300"></div>
                <div id="master-svg" class="flex justify-center mb-1 scale-90 h-20 items-center drop-shadow-md"></div>
                <p class="text-yellow-600 font-black text-xl relative z-10 mt-1">🏆 たし算マスター免許</p>
                <button onclick="startCertFlow()" class="absolute bottom-3 right-3 bg-yellow-400 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg hover:bg-yellow-500 z-20 cursor-pointer flex items-center gap-1">
                    <i data-lucide="award" class="w-3 h-3"></i> つくる
                </button>
            </div>
            
            <div class="glass p-3 rounded-2xl shadow-sm flex-none">
                <h3 class="text-xs font-black text-pink-700 mb-2 flex items-center gap-2 border-b border-pink-100 pb-1">
                    <i data-lucide="star" class="w-4 h-4 text-yellow-400 fill-current"></i> スペシャルチャレンジ
                </h3>
                <div class="grid grid-cols-3 gap-2" id="special-badges-grid"></div>
            </div>
            
            <div class="bg-white/60 rounded-2xl p-3 shadow-md border border-white/50 flex-1 min-h-0 flex flex-col">
                <div class="overflow-y-auto flex-1 no-scrollbar">
                    <table class="w-full text-xs text-center border-collapse">
                        <thead class="sticky top-0 bg-white/90 backdrop-blur-sm z-10">
                            <tr class="text-pink-400 border-b border-pink-100">
                                <th class="pb-2 font-bold text-left pl-4">もんだい</th>
                                <th class="pb-2 font-bold text-sm">なし</th>
                                <th class="pb-2 font-bold text-sm">あり</th>
                                <th class="pb-2 font-bold text-sm">ランダム</th>
                            </tr>
                        </thead>
                        <tbody id="record-tbody" class="text-gray-600"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="screen-cert-maker" class="screen hidden glass rounded-xl p-2 text-center flex-1 flex flex-col justify-start overflow-y-auto no-scrollbar relative">
            <h2 class="text-lg font-black text-pink-600 mb-2 flex items-center justify-center gap-2">
                <i data-lucide="award" class="w-5 h-5 text-yellow-500"></i> めんきょしょう
            </h2>
            <p class="text-[10px] text-gray-500 mb-2">文字や写真はタップしてかえられるよ。<br>スクショをとってね！</p>

            <div id="cert-node" class="cert-container relative w-full bg-white rounded shadow-xl overflow-hidden">
                <img src="https://github.com/byakusen/tasizan_menkyo5/blob/main/tasizan_menkyo.png?raw=true" class="cert-bg" alt="認定証背景">
                
                <input type="text" id="in-school" value="" placeholder="がっこう" class="cert-input text-center" 
                       style="top: 46%; left: 37.5%; width: 34%;">

                <input type="text" id="in-grade" value="1" class="cert-input text-center" 
                       style="top: 46.0%; left: 79.9%; width: 10%;">

                <input type="text" id="in-name" value="" placeholder="おなまえ" class="cert-input text-center" 
                       style="top: 33.5%; left: 31%; width: 44%;">
                
                <div id="cert-photo" class="cert-photo-area" onclick="document.getElementById('file-input').click()" 
                     style="top: 36.8%; left: 11.2%; width: 18%; height: 42%; border-radius: 8px;">
                    
                    <img id="cert-photo-img" class="w-full h-full object-cover hidden" style="border-radius: 8px;">
                    <div id="cert-photo-placeholder" class="text-center text-pink-300">
                        <i data-lucide="camera" class="w-5 h-5 mx-auto mb-1"></i>
                        <span class="text-[8px] block leading-tight font-bold">しゃしん</span>
                    </div>
                </div>
            </div>

            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="loadPhoto(event)">

            <button onclick="startCamera()" class="mt-4 py-3 px-6 rounded-full bg-pink-500 text-white font-bold text-sm shadow-md btn-active flex items-center justify-center gap-2 mx-auto">
                <i data-lucide="camera" class="w-5 h-5"></i> カメラでとる
            </button>

            <div id="camera-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center">
                <p class="text-white font-bold mb-4">わくにおさまるようにしゃしんをとってね</p>
                <video id="camera-video" class="w-11/12 max-w-sm bg-black rounded-lg mb-6 border-2 border-pink-400" autoplay playsinline></video>
                <div class="flex gap-4">
                    <button onclick="takePhoto()" class="py-3 px-8 rounded-full bg-rose-500 text-white font-bold text-lg shadow-md btn-active">
                        📸 とる
                    </button>
                    <button onclick="stopCamera()" class="py-3 px-6 rounded-full bg-gray-500 text-white font-bold text-base shadow-md btn-active">
                        やめる
                    </button>
                </div>
                <canvas id="camera-canvas" class="hidden"></canvas>
            </div>
            <button onclick="switchTab('record')" class="mt-4 py-2 px-6 rounded-full bg-gray-400 text-white font-bold text-xs shadow-md btn-active mx-auto block w-fit">
                もどる
            </button>
        </div>

    </div>

    <audio id="se-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="se-wrong" src="https://assets.mixkit.co/active_storage/sfx/255/255-preview.mp3"></audio>
    <audio id="se-fanfare" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
    <audio id="se-crumble" src="https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3"></audio>

    <script>
        // 1の段〜9の段
        const STAGES = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        
        let state = {
            dan: 1, 
            mode: 'NO_CARRY', // 'NO_CARRY', 'HAS_CARRY', 'RANDOM'
            gameType: 'stage',
            problems: [], 
            index: 0, 
            inputAns: "", 
            timer: 30, 
            maxTime: 30,
            intervalId: null, 
            currentKey: "", 
            waitingForCrumble: false
        };
        
        // localStorageキー
        const STORAGE_KEY_RECORDS = 'tasizan_records_v1';
        const STORAGE_KEY_NAME = 'tasizan_username';
        const STORAGE_KEY_VIEW = 'tasizan_view_state';
        const STORAGE_KEY_CERT = 'tasizan_cert_info';
        const STORAGE_KEY_NIGATE = 'tasizan_nigate_list'; // ニガテ用キー

        let savedRecords = JSON.parse(localStorage.getItem(STORAGE_KEY_RECORDS)) || {};
        let savedName = localStorage.getItem(STORAGE_KEY_NAME) || "";
        let savedNigate = JSON.parse(localStorage.getItem(STORAGE_KEY_NIGATE)) || [];

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('user-name-input').value = savedName;
            
            loadCertInfo();
            renderMenu();
            renderRecords();
            adjustCertFonts();

            window.addEventListener('resize', adjustCertFonts);

            // 前回の画面状態復帰

        // --- ヒント機能 ---
        function toggleHint() {
            const area = document.getElementById('hint-area');
            const btn = document.getElementById('btn-hint');
            if (area.classList.contains('hidden')) {
                area.classList.remove('hidden');
                btn.innerHTML = `<i data-lucide="lightbulb-off" class="w-3 h-3"></i> ヒントをかくす`;
                renderBlocks();
            } else {
                area.classList.add('hidden');
                btn.innerHTML = `<i data-lucide="lightbulb" class="w-3 h-3"></i> ヒントをみる`;
            }
            lucide.createIcons();
        }

        function renderBlocks() {
            const p = state.problems[state.index];
            const parts = p.q.split('+');
            const num1 = parseInt(parts[0].trim());
            const num2 = parseInt(parts[1].trim());
            
            const container = document.getElementById('blocks-container');
            container.innerHTML = '';
            
            // 1段目 (10個枠)
            const row1 = document.createElement('div');
            row1.className = "flex gap-1 justify-center bg-white/60 p-1.5 rounded-lg border border-pink-50";
            
            // 2段目 (10個枠)
            const row2 = document.createElement('div');
            row2.className = "flex gap-1 justify-center bg-white/60 p-1.5 rounded-lg border border-pink-50 mt-1";
            
            // 枠作成ヘルパー
            const createSlots = (row, startIdx) => {
                for(let i=0; i<10; i++) {
                    const slot = document.createElement('div');
                    slot.className = "block-circle block-empty";
                    if (i === 5) {
                        const sp = document.createElement('div');
                        sp.className = "block-spacer";
                        row.appendChild(sp);
                    }
                    row.appendChild(slot);
                }
            };
            
            createSlots(row1);
            createSlots(row2);
            
            // ブロック配置
            // 1. 赤ブロック (num1) を1段目に配置
            const slots1 = row1.querySelectorAll('.block-circle');
            let filled1 = 0;
            for(let i=0; i<num1; i++) {
                if(i < 10) {
                    slots1[i].className = "block-circle block-red";
                    filled1++;
                }
            }
            
            // 2. 青ブロック (num2) を配置
            // まず1段目の残りを埋める
            let remainingBlue = num2;
            for(let i=filled1; i<10 && remainingBlue > 0; i++) {
                slots1[i].className = "block-circle block-blue";
                remainingBlue--;
            }
            
            // 残りを2段目に配置
            const slots2 = row2.querySelectorAll('.block-circle');
            for(let i=0; i<remainingBlue && i<10; i++) {
                slots2[i].className = "block-circle block-blue";
            }
            
            container.appendChild(row1);
            if (num1 + num2 > 10) {
                container.appendChild(row2);
            } else {
                 // 答えが10以下なら2段目は非表示でもよいが、一貫性のため表示するか、
                 // あるいは空のまま表示しておくか。ここでは一貫性のため表示。
                 container.appendChild(row2);
            }
        }

        // --- 問題生成ロジック ---
        function startGame(type, val) {
            state.gameType = type;
            state.inputAns = "";
            
            // ヒントリセット
            document.getElementById('hint-area').classList.add('hidden');
            document.getElementById('btn-hint').innerHTML = `<i data-lucide="lightbulb" class="w-3 h-3"></i> ヒントをみる`;
            
            let time = 30;
            let list = [];
            let key = "";
            
            if (type === 'stage') {
                // 通常ステージ: 10問
                const d = state.dan;
                list = generateProblemsWithCount(d, state.mode, 10);
                key = `stage-${d}-${state.mode}`;
                time = 30;

            } else if (type === 'range') {
                // まとめ: 20問
                const range = val === '15' ? [1,2,3,4,5] : [6,7,8,9];
                list = generateRandomProblemsFromRange(range, 20);
                time = 60;
                key = `range-${val}`;

            } else if (type === 'last') {
                // 全問: 30問
                const range = [1,2,3,4,5,6,7,8,9];
                list = generateRandomProblemsFromRange(range, 30);
                time = 90;
                key = `last-challenge`;
            } else if (type === 'nigate') {
                // ニガテ特訓: 最大10問 (シャッフルして出題)
                list = shuffleArray([...savedNigate]).slice(0, 10);
                time = 60;
                key = 'nigate-training';
            }
            
            // 安全策
            if (list.length === 0) list = [{q: "1 + 1", a: 2}];

            state.problems = list;
            state.index = 0;
            state.timer = time;
            state.maxTime = time;
            state.currentKey = key;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('screen-game').classList.remove('hidden');
            updateDisplay();
            
            if (state.intervalId) clearInterval(state.intervalId);
            state.intervalId = setInterval(() => {
                state.timer--;
                const timerEl = document.getElementById('display-timer');
                const barEl = document.getElementById('time-bar');
                timerEl.innerText = state.timer;
                
                const pct = (state.timer / state.maxTime) * 100;
                barEl.style.width = pct + '%';
                
                if (state.timer <= 10) {
                    timerEl.classList.add('text-rose-600');
                    barEl.className = 'h-full rounded-full transition-all duration-1000 ease-linear bg-rose-500';
                } else {
                    timerEl.classList.remove('text-rose-600');
                    barEl.className = 'h-full rounded-full transition-all duration-1000 ease-linear bg-gradient-to-r from-pink-300 to-rose-400';
                }
                
                if (state.timer <= 0) finishGame(false);
            }, 1000);
            
            lucide.createIcons();
        }

        // 指定の段・モードで、重複許容で指定数生成
        function generateProblemsWithCount(dan, mode, count) {
            let candidates = [];
            for (let i = 1; i <= 9; i++) {
                const ans = dan + i;
                const isCarry = ans >= 10;
                
                if (mode === 'RANDOM') {
                    candidates.push({ q: `${dan} + ${i}`, a: ans });
                } else if (mode === 'NO_CARRY' && !isCarry) {
                    candidates.push({ q: `${dan} + ${i}`, a: ans });
                } else if (mode === 'HAS_CARRY' && isCarry) {
                    candidates.push({ q: `${dan} + ${i}`, a: ans });
                }
            }
            if (candidates.length === 0) {
                 for (let i = 1; i <= 9; i++) candidates.push({ q: `${dan} + ${i}`, a: dan + i });
            }

            let result = [];
            for(let i=0; i<count; i++) {
                let r;
                if (candidates.length > 1) {
                    do {
                        r = candidates[Math.floor(Math.random() * candidates.length)];
                    } while (result.length > 0 && result[result.length-1].q === r.q);
                } else {
                     r = candidates[Math.floor(Math.random() * candidates.length)];
                }
                result.push(r);
            }
            return result;
        }

        // 指定レンジ（段の配列）からランダムに重複許容で指定数生成
        function generateRandomProblemsFromRange(danList, count) {
            let candidates = [];
            danList.forEach(d => {
                for(let i=1; i<=9; i++) {
                    candidates.push({ q: `${d} + ${i}`, a: d+i });
                }
            });

            let result = [];
            for(let i=0; i<count; i++) {
                let r;
                if (candidates.length > 1) {
                    do {
                        r = candidates[Math.floor(Math.random() * candidates.length)];
                    } while (result.length > 0 && result[result.length-1].q === r.q);
                } else {
                     r = candidates[Math.floor(Math.random() * candidates.length)];
                }
                result.push(r);
            }
            return result;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateDisplay() {
            const p = state.problems[state.index];
            document.getElementById('q-text').innerText = p.q;
            
            // ヒント表示中なら更新
            const area = document.getElementById('hint-area');
            if (!area.classList.contains('hidden')) {
                renderBlocks();
            } else {
                // 問題が変わったらヒントを隠す（デフォルト挙動）
                // ただし今回は「ずっとヒントを見たい」場合もあるかもなので、
                // 強制的に隠す処理を入れるかどうか。
                // 上記startGameで隠しているので、ここはそのまま。
            }
            
            const aField = document.getElementById('a-field');
            if (state.inputAns === "") {
                aField.innerText = "?";
                aField.classList.add('text-rose-200');
                aField.classList.remove('text-rose-600');
            } else {
                aField.innerText = state.inputAns;
                aField.classList.remove('text-rose-200');
                aField.classList.add('text-rose-600');
            }
            
            document.getElementById('display-count').innerText = `あと ${state.problems.length - state.index} 問`;
        }

        function inputNum(num) {
            // 最大2桁まで
            if (state.inputAns.length >= 2) return;
            state.inputAns += num.toString();
            updateDisplay();
        }

        function deleteNum() {
            state.inputAns = state.inputAns.slice(0, -1);
            updateDisplay();
        }

        function submitAnswer() {
            if (state.inputAns === "") return;
            
            const p = state.problems[state.index];
            const ans = parseInt(state.inputAns);
            
            if (ans === p.a) {
                playAudio('se-correct');
                
                // ニガテモードで正解なら削除
                if (state.gameType === 'nigate') {
                    removeFromNigate(p);
                }

                state.index++;
                state.inputAns = "";
                if (state.index >= state.problems.length) finishGame(true);
                else {
                    // 次の問題へ。ヒントは隠す
                    document.getElementById('hint-area').classList.add('hidden');
                    document.getElementById('btn-hint').innerHTML = `<i data-lucide="lightbulb" class="w-3 h-3"></i> ヒントをみる`;
                    lucide.createIcons();
                    updateDisplay();
                }
            } else {
                // 間違えたら即終了 + ニガテに追加（ニガテモード中は追加しない）
                playAudio('se-wrong');
                if (state.gameType !== 'nigate') {
                    addToNigate(p);
                }
                finishGame(false);
            }
        }
        
        // ニガテリストに追加
        function addToNigate(prob) {
            // 既に存在するかチェック
            const exists = savedNigate.some(p => p.q === prob.q);
            if (!exists) {
                savedNigate.push(prob);
                // 100件超えたら古いものから削除
                if (savedNigate.length > 100) savedNigate.shift();
                localStorage.setItem(STORAGE_KEY_NIGATE, JSON.stringify(savedNigate));
            }
        }
        
        // ニガテリストから削除
        function removeFromNigate(prob) {
            savedNigate = savedNigate.filter(p => p.q !== prob.q);
            localStorage.setItem(STORAGE_KEY_NIGATE, JSON.stringify(savedNigate));
        }

        function finishGame(isWin) {
            clearInterval(state.intervalId);
            const resScreen = document.getElementById('screen-result');
            const msg = document.getElementById('result-msg');
            const sub = document.getElementById('result-sub');
            const svgBox = document.getElementById('hanamaru-area');
            
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            resScreen.classList.remove('hidden');
            
            if (isWin) {
                // ニガテモードクリア時
                if (state.gameType === 'nigate') {
                    if (savedNigate.length === 0) {
                        msg.innerText = "ニガテこくふく！";
                        sub.innerText = "ぜんぶクリアしたよ！すごい！";
                    } else {
                        msg.innerText = "とっくんクリア！";
                        sub.innerText = `のこり ${savedNigate.length} もん！がんばれ！`;
                    }
                    svgBox.innerHTML = createHanamaruSVG(200, "努力賞");
                    launchFireworks();
                } else {
                    msg.innerText = "クリア！";
                    msg.className = "text-5xl font-black text-rose-500 mb-2 drop-shadow-sm";
                    sub.innerText = "すごい！ぜんもんせいかい！";
                    
                    // 記録保存
                    const wasLocked = !(savedRecords['range-15'] && savedRecords['range-69']);
                    savedRecords[state.currentKey] = true;
                    localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(savedRecords));
                    
                    // 解放判定
                    const isNowUnlocked = savedRecords['range-15'] && savedRecords['range-69'];
                    if (wasLocked && isNowUnlocked) {
                        state.waitingForCrumble = true;
                    }
                    
                    const lbl = (state.currentKey === 'last-challenge') ? "免許皆伝" : "ごうかく";
                    svgBox.innerHTML = createHanamaruSVG(200, lbl);
                    
                    if (state.currentKey === 'last-challenge') {
                        playAudio('se-fanfare');
                        launchFireworks(); 
                    } else {
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }
                }
            } else {
                msg.innerText = "おしまい";
                msg.className = "text-4xl font-black text-slate-500 mb-2";
                sub.innerText = "まちがえちゃった... もういちど！";
                svgBox.innerHTML = `<div class="bg-gray-100 p-8 rounded-full shadow-inner"><i data-lucide="x-circle" class="w-20 h-20 text-gray-300"></i></div>`;
                lucide.createIcons();
            }
        }

        function playAudio(id) {
            const a = document.getElementById(id);
            a.currentTime = 0;
            a.play().catch(()=>{});
        }

        function createHanamaruSVG(size, label) {
            return `
            <svg width="${size}" height="${size}" viewBox="0 0 200 200" class="drop-shadow-lg">
                <path class="path-hanamaru" d="M100,20 C110,5 140,5 150,25 C175,20 195,40 190,65 C210,75 210,105 190,115 C195,140 175,160 150,155 C140,180 110,180 100,160 C90,180 60,180 50,155 C25,160 5,140 10,115 C-10,105 -10,75 10,65 C5,40 25,20 50,25 C60,5 90,5 100,20" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle class="path-hanamaru" cx="100" cy="90" r="55" fill="none" stroke="#f43f5e" stroke-width="5" />
                <text x="100" y="102" text-anchor="middle" fill="#f43f5e" font-weight="900" font-size="28" style="font-family: 'M PLUS Rounded 1c'">${label}</text>
            </svg>`;
        }

        function renderRecords() {
            const badgeGrid = document.getElementById('special-badges-grid');
            badgeGrid.innerHTML = "";
            [['range-15', '1〜5まとめ'], ['range-69', '6〜9まとめ'], ['last-challenge', '全問制覇']].forEach(([k, n]) => {
                const ok = savedRecords[k];
                const d = document.createElement('div');
                d.className = `p-2 rounded-xl flex flex-col items-center justify-center gap-1 ${ok ? 'bg-yellow-100 text-yellow-600 border-2 border-yellow-200 shadow-sm' : 'bg-gray-50 text-gray-300 border border-gray-200'}`;
                d.innerHTML = `<i data-lucide="trophy" class="w-6 h-6 ${ok?'fill-yellow-400 text-yellow-500':''}"></i><span class="text-[10px] font-bold leading-tight">${n}</span>`;
                badgeGrid.appendChild(d);
            });

            const tbody = document.getElementById('record-tbody');
            tbody.innerHTML = "";
            for(let d=1; d<=9; d++){
                const tr = document.createElement('tr');
                tr.className = "border-b border-pink-50 hover:bg-pink-50/50 transition-colors";
                let h = `<td class="text-left pl-4 font-bold text-pink-900 py-1 text-base">${d}＋〇</td>`;
                ['NO_CARRY', 'HAS_CARRY', 'RANDOM'].forEach(m => {
                    const ok = savedRecords[`stage-${d}-${m}`];
                    
                    // 9の段のくり上がりなしは「-」表示
                    if (d === 9 && m === 'NO_CARRY') {
                         h += `<td class="text-center text-gray-300 text-[10px]">-</td>`;
                    } else {
                         h += `<td class="text-center"><div class="w-6 h-6 mx-auto rounded-full flex items-center justify-center ${ok ? 'bg-rose-400 text-white shadow-sm' : 'bg-gray-100'}"><i data-lucide="check" class="w-4 h-4 ${ok?'':'hidden'}"></i></div></td>`;
                    }
                });
                tr.innerHTML = h;
                tbody.appendChild(tr);
            }

            if(savedRecords['last-challenge']) {
                document.getElementById('master-badge').classList.remove('hidden');
                document.getElementById('master-svg').innerHTML = createHanamaruSVG(120, "神");
            }
            lucide.createIcons();
        }

        // 岩を砕く演出
        function checkUnlockAndCrumble() {
            const rock = document.getElementById('rock-layer');
            if (!rock) return;
            // 解放条件: 各レンジのRANDOMモード全クリア
            const is15 = [1,2,3,4,5].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const is69 = [6,7,8,9].every(d => savedRecords[`stage-${d}-RANDOM`]);
            const isUnlocked = is15 && is69;
            
            if (isUnlocked && !rock.classList.contains('hidden')) {
                rock.classList.add('animate-shake');
                playAudio('se-crumble'); 
                
                setTimeout(() => {
                    createRockFragments(rock);
                    rock.classList.add('hidden');
                    const btn = document.getElementById('btn-sp-last');
                    btn.disabled = false;
                    btn.className = "w-full h-full rounded-lg font-black text-base shadow-xl bg-gradient-to-r from-yellow-300 to-orange-400 text-white btn-active relative z-30 animate-pulse flex items-center justify-center gap-2";
                    btn.innerHTML = `<i data-lucide="crown" class="w-5 h-5 fill-white"></i> ぜんぶにちょうせん！`;
                    lucide.createIcons();
                }, 800);
            }
        }

        function createRockFragments(rockElem) {
            const container = document.getElementById('last-challenge-box');
            
            for (let i = 0; i < 20; i++) {
                const fragment = document.createElement('div');
                fragment.className = 'rock-fragment';
                const size = Math.random() * 20 + 10;
                fragment.style.width = size + 'px';
                fragment.style.height = size + 'px';
                fragment.style.left = '50%';
                fragment.style.top = '50%';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 150 + 50;
                const tx = Math.cos(angle) * dist + 'px';
                const ty = Math.sin(angle) * dist + 'px';
                const tr = (Math.random() - 0.5) * 720 + 'deg';
                fragment.style.setProperty('--tx', tx);
                fragment.style.setProperty('--ty', ty);
                fragment.style.setProperty('--tr', tr);
                fragment.style.animation = 'fragmentFly 1s ease-out forwards';
                container.appendChild(fragment);
                setTimeout(() => fragment.remove(), 1000);
            }
        }

        function launchFireworks() {
            const container = document.getElementById('fireworks-container');
            container.innerHTML = '';
            const colors = ['#f43f5e', '#fbbf24', '#3b82f6', '#10b981', '#a855f7'];
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    const cx = Math.random() * 80 + 10;
                    const cy = Math.random() * 50 + 10;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    for(let j=0; j<20; j++) {
                        const p = document.createElement('div');
                        p.className = 'firework-particle';
                        p.style.backgroundColor = color;
                        p.style.left = cx + '%'; p.style.top = cy + '%';
                        const angle = (j / 20) * 360;
                        const dist = Math.random() * 120 + 60;
                        const dx = Math.cos(angle * Math.PI / 180) * dist + 'px';
                        const dy = Math.sin(angle * Math.PI / 180) * dist + 'px';
                        p.style.setProperty('--dx', dx);
                        p.style.setProperty('--dy', dy);
                        p.style.animation = 'explode 1s ease-out forwards';
                        container.appendChild(p);
                        setTimeout(() => p.remove(), 1000);
                    }
                }, i * 300);
            }
        }

        // ▼ ここから追加：WebRTCを使用したカメラ機能 ▼
        let currentStream = null;

        async function startCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-video');
            modal.classList.remove('hidden');
            
            try {
                // カメラへのアクセスを要求
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = currentStream;
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                alert("カメラを起動できませんでした。ブラウザのカメラきょか（権限）をかくにんしてください。");
                stopCamera();
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('camera-modal').classList.add('hidden');
            document.getElementById('camera-video').srcObject = null;
        }

        function takePhoto() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            const img = document.getElementById('cert-photo-img');
            const placeholder = document.getElementById('cert-photo-placeholder');
            
            if (!currentStream) return;

            // 描画用のキャンバスサイズをビデオに合わせる
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // キャンバスから画像データを取得してimgタグにセット
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            img.src = dataUrl;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
            
            stopCamera();
        }
        // ▲ ここまで追加 ▲
    </script>
</body>
